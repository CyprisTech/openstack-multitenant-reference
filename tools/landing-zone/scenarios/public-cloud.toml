# The public cloud profile (ADR-0014): what differs from the private cloud, with the member role,
# hub planes only. Kubernetes, the internal authority and the internal service are proven by the
# private cloud campaign and not run again here.
profile = "public-cloud"
modes   = ["interface"]

[stacks]
planes      = "stacks/shared/planes"
receiver    = "tests/fixtures/receiver"
entry-point = "stacks/shared/entry-point"

[sequences]
foundation = ["prep", "planes", "receiver", "edge", "tenant-web", "tenant-private", "transit", "publish"]
checks     = ["accept", "direct", "hostile"]
end        = ["plans", "teardown", "leftovers"]
# lz try: the deployment steps only, with the test fixtures, no check.
try        = ["foundation"]
full       = ["foundation", "checks", "end"]

# Settings of the steps.
# The inputs of the profile (README, profiles): the bastion on the stack's network.
[options.inputs.entry-point]
bastion_placement = "stack-network"

[options.inputs.web]
bastion_placement = "stack-network"

[options.inputs.receiver]
bastion_placement = "stack-network"

# Hub planes only (publication and observability, interface mode): no internal plane.
[options.planes.attachments]
receiver = { stack = "receiver", cidr = "10.34.0.0/28", planes = { observability = "shared" } }
edge     = { stack = "entry-point", cidr = "10.20.0.0/24", planes = { publication = "shared", observability = "tenant" } }

[options.planes.tenant_ranges]
publication   = ["10.21.0.0/16", "10.22.0.0/15"]
observability = ["10.20.0.0/14"]

# The tenants, as in the configuration of a deployment (lz deploy).
[[tenants]]
name   = "web"
type   = "vm"
cidr   = "10.21.0.0/24"
planes = { publication = "tenant", observability = "tenant" }
values = { exposure = "entry-point", egress = "router" }

[[tenants]]
name   = "private"
type   = "vm"
cidr   = "10.22.0.0/24"
planes = { observability = "tenant" }
values = { exposure = "none", egress = "none", instance_count = 1 }
