# The private cloud profile (ADR-0014): the whole scenario, both plane modes. The two clusters are
# deployed one after the other, so that the campaign fits a small test cloud.
profile = "private-cloud"
modes   = ["gateway", "interface"]

# Every stack of the scenario, in the order they are applied: key = path from the repository root.
[stacks]
planes           = "stacks/shared/planes"
receiver         = "tests/fixtures/receiver"
acme             = "tests/fixtures/acme"
resolver         = "tests/fixtures/resolver"
egress           = "stacks/shared/egress"
entry-point      = "stacks/shared/entry-point"

[sequences]
foundation = ["prep", "planes", "receiver", "acme", "service-internal-service", "resolver", "egress", "edge", "tenant-web", "tenant-private",
              "tenant-egress-shared", "deploy-egress-tenants", "transit", "publish"]
shared     = ["service-shared", "transit", "cluster-shared", "tour-shared", "accept-shared", "consumer", "volume", "rotate",
              "upgrade", "shared-down"]
published  = ["tenant-published", "cluster-published", "internal-open", "transit", "tour", "publish", "accept", "direct",
              "direct-k8s", "hostile"]
end        = ["plans", "teardown", "leftovers"]
# lz try: the deployment steps only, with the test fixtures, no check.
try        = ["foundation", "tenant-published", "cluster-published", "internal-open", "transit", "publish"]
full       = ["foundation", "shared", "published", "end"]
# From the previous release (lz campaign --from <tag>): the new release applied over its states, then
# the scenario without the steps that created them.
from-previous = ["migrate", "tour-shared", "accept-shared", "consumer", "volume", "rotate", "upgrade", "shared-down", "published", "end"]

# Settings of the steps.
[options.from]
# The steps of the previous release that deploy it with its own campaign tool: the foundation and the shared cluster,
# without acceptance. The previous release's isolated tenant is not deployed: this release removes
# its stack (a private tenant of stacks/tenants/vm instead); nor is its internal service, a fixture
# this release replaces by stacks/shared/vm (its state would stay behind a removed directory).
previous      = ["prep", "planes", "receiver", "acme", "edge", "web", "transit", "publish", "k8s-shared", "transit", "cluster-shared"]
# The steps of this release that apply it over them (step migrate), then the shared cluster updated.
apply         = ["prep", "planes", "receiver", "acme", "service-internal-service", "resolver", "egress", "edge", "tenant-web", "tenant-private",
                 "tenant-egress-shared", "deploy-egress-tenants", "transit", "publish", "service-shared", "transit", "update-shared"]
# The previous release kept the web tenant and the shared cluster in the default state of their
# directory; this release gives each its own state.
default_state = ["web", "shared"]

[options.plans]
skip = ["shared"]   # removed by shared-down before the end

# The attachments of the planes stack: the project of a stack, its range, the role it has on
# each plane. Only those whose stack is in the scenario are written.
[options.planes.attachments]
receiver         = { stack = "receiver", cidr = "10.34.0.0/28", planes = { observability = "shared" } }
acme             = { stack = "acme", cidr = "10.37.0.0/28", planes = { internal = "shared" } }
resolver         = { stack = "resolver", cidr = "10.38.0.0/28", planes = { internal = "shared" } }
egress           = { stack = "egress", cidr = "10.39.0.0/27", planes = { internal = "shared", observability = "tenant" } }
edge             = { stack = "entry-point", cidr = "10.20.0.0/24", planes = { publication = "shared", observability = "tenant" } }

[options.planes.tenant_ranges]
publication   = ["10.21.0.0/16", "10.22.0.0/15", "10.24.0.0/14"]
observability = ["10.20.0.0/14", "10.24.0.0/14", "10.36.0.0/24", "10.39.0.0/27"]
internal      = ["10.20.0.0/14", "10.24.0.0/14"]

# The tenants and the shared services, as in the configuration of a deployment (lz deploy): the
# campaign deploys them with the same steps (tenant-<name>, service-<name>, cluster-<name>).
[[tenants]]
name   = "web"
type   = "vm"
cidr   = "10.21.0.0/24"
planes = { publication = "tenant", observability = "tenant", internal = "tenant" }
values = { exposure = "entry-point", egress = "router" }

[[tenants]]
name     = "private"                # ADR-0016, D1: neither exposure nor egress
type     = "vm"
cidr     = "10.22.0.0/24"
planes   = { observability = "tenant", internal = "tenant" }
values   = { exposure = "none", egress = "none", instance_count = 1 }
resolver = true                     # the test resolver behind the internal services plane (ADR-0016, D3)

[[tenants]]
name           = "egress-shared"    # out through the shared egress (ADR-0016, D1)
type           = "vm"
cidr           = "10.23.0.0/24"
planes         = { observability = "tenant", internal = "tenant" }
values         = { exposure = "none", egress = "shared", instance_count = 1 }
egress_proxy   = true
egress_domains = [".archive.ubuntu.com", ".security.ubuntu.com"]

[[tenants]]
name   = "published"                # the published cluster
type   = "kubernetes"
cidr   = "10.24.0.0/24"
planes = { publication = "tenant", observability = "tenant", internal = "tenant" }
values = { exposure = "entry-point" }

[[shared-services]]
name      = "internal-service"      # a shared service on virtual machines, the one the published cluster consumes
type      = "vm"
cidr      = "10.35.0.0/28"
planes    = { internal = "shared" }     # not on observability: its project holds the receiver, and a hub plane takes one attachment per project
consumers = ["published"]           # closed until the published cluster exists (step internal-open)
values    = { egress = "router", services = { internal = { ports = [8080] } } }

[[shared-services]]
name       = "shared"               # the shared cluster
type       = "kubernetes"
attachment = "k8s-shared"           # its attachment's name since v0.5: kept, nothing replaced on upgrade
cidr       = "10.36.0.0/24"
planes     = { internal = "shared", observability = "tenant" }
consumers  = ["web"]
demo       = true                   # the demonstrated services (stacks/shared/kubernetes/demo)
