# The private cloud profile (ADR-0014): the whole scenario, both plane modes. The two clusters are
# deployed one after the other, so that the campaign fits a small test cloud.
profile = "private-cloud"
modes   = ["gateway", "interface"]

# Every stack of the scenario, in the order they are applied: key = path from the repository root.
[stacks]
planes           = "stacks/shared/planes"
receiver         = "tests/fixtures/receiver"
acme             = "tests/fixtures/acme"
internal-service = "tests/fixtures/internal-service"
resolver         = "tests/fixtures/resolver"
egress           = "stacks/shared/egress"
entry-point      = "stacks/shared/entry-point"
vm               = { path = "stacks/tenants/vm", state = "web" }
private          = { path = "stacks/tenants/vm", state = "private" }
egress-shared    = { path = "stacks/tenants/vm", state = "egress-shared" }
shared           = "stacks/shared/kubernetes"
published        = "stacks/tenants/kubernetes"

[sequences]
foundation = ["prep", "planes", "receiver", "acme", "internal", "resolver", "egress", "edge", "web", "private", "egress-tenant", "transit", "publish"]
shared     = ["k8s-shared", "transit", "cluster-shared", "tour-shared", "accept-shared", "consumer", "volume", "rotate", "upgrade", "shared-down"]
published  = ["k8s", "cluster", "internal-open", "transit", "tour", "publish", "accept", "direct", "direct-k8s", "hostile"]
end        = ["plans", "teardown", "leftovers"]
full       = ["foundation", "shared", "published", "end"]
# From the previous release (run.py --from <tag>): the new release applied over its states, then
# the scenario without the steps that created them.
from-previous = ["migrate", "tour-shared", "accept-shared", "consumer", "volume", "rotate", "upgrade", "shared-down", "published", "end"]

# Settings of the steps.
[options.from]
# The steps of the previous release's run.py that deploy it: the foundation and the shared cluster,
# without acceptance. The previous release's isolated tenant is not deployed: this release removes
# its stack (a private tenant of stacks/tenants/vm instead).
previous      = ["prep", "planes", "receiver", "acme", "internal", "edge", "web", "transit", "publish", "k8s-shared", "transit", "cluster-shared"]
# The steps of this release that apply it over them (step migrate), then the shared cluster updated.
apply         = ["prep", "planes", "receiver", "acme", "internal", "resolver", "egress", "edge", "web", "private", "egress-tenant", "transit", "publish", "k8s-shared", "transit", "update-shared"]
# The previous release kept the vm tenant in the default state of stacks/tenants/vm.
default_state = ["vm"]

[options.plans]
skip = ["shared"]   # removed by shared-down before the end

# The attachments of the planes stack: the project of a stack, its range, the role it has on
# each plane. Only those whose stack is in the scenario are written.
[options.planes.attachments]
receiver         = { stack = "receiver", cidr = "10.34.0.0/28", planes = { observability = "shared" } }
internal-service = { stack = "internal-service", cidr = "10.35.0.0/28", planes = { internal = "shared" } }
acme             = { stack = "acme", cidr = "10.37.0.0/28", planes = { internal = "shared" } }
resolver         = { stack = "resolver", cidr = "10.38.0.0/28", planes = { internal = "shared" } }
egress           = { stack = "egress", cidr = "10.39.0.0/27", planes = { internal = "shared", observability = "tenant" } }
edge             = { stack = "entry-point", cidr = "10.20.0.0/24", planes = { publication = "shared", observability = "tenant" } }
web              = { stack = "vm", cidr = "10.21.0.0/24", planes = { publication = "tenant", observability = "tenant", internal = "tenant" } }
private          = { stack = "private", cidr = "10.22.0.0/24", planes = { observability = "tenant", internal = "tenant" } }
egress-shared    = { stack = "egress-shared", cidr = "10.23.0.0/24", planes = { observability = "tenant", internal = "tenant" } }
published        = { stack = "published", cidr = "10.24.0.0/24", planes = { publication = "tenant", observability = "tenant", internal = "tenant" } }
k8s-shared       = { stack = "shared", cidr = "10.36.0.0/24", planes = { internal = "shared", observability = "tenant" } }

[options.planes.tenant_ranges]
publication   = ["10.21.0.0/16", "10.22.0.0/15", "10.24.0.0/14"]
observability = ["10.20.0.0/14", "10.24.0.0/14", "10.36.0.0/24", "10.39.0.0/27"]
internal      = ["10.20.0.0/14", "10.24.0.0/14"]
