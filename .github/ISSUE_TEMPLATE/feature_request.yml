name: Feature request
description: Propose a change to the architecture, a stack or the tests
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build or check, and why does the architecture not cover it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Which layer, stack or matrix row would change? A sketch helps.
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: What would the change cost, and when is the current choice better? See docs/trade-offs.md.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This concerns the architecture or its stacks, not a capability of the terraform-openstack-tenant module (which belongs to its own repository).
          required: true
