name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Every root configuration of the repository. The stacks and the test configurations call the
  # published module by tag: init downloads it from GitHub.
  CONFIGURATIONS: >-
    modules/admission
    modules/bastion
    modules/plane-attachment
    modules/plane-discovery
    modules/range-overlaps
    stacks/shared/planes
    stacks/shared/entry-point
    stacks/tenants/vm
    stacks/tenants/isolated
    stacks/tenants/kubernetes
    tests/fixtures/receiver
    tests/fixtures/intranet-service
    tests/fixtures/acme

jobs:
  validate:
    name: validate (${{ matrix.tool }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported versions and latest, for both tools
          - { tool: tofu, version: "1.9.0" }
          - { tool: tofu, version: "latest" }
          - { tool: terraform, version: "1.9.0" }
          - { tool: terraform, version: "latest" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false

      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false

      - name: fmt
        run: ${{ matrix.tool }} fmt -check -recursive -diff

      - name: init and validate every configuration
        run: |
          for d in $CONFIGURATIONS; do
            echo "::group::$d"
            ${{ matrix.tool }} -chdir="$d" init -backend=false -input=false
            ${{ matrix.tool }} -chdir="$d" validate
            echo "::endgroup::"
          done

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init
      # Stacks: recommended preset plus documented variables and outputs; warnings fail the job.
      - name: stacks
        run: |
          for d in modules/admission modules/bastion modules/metrics-agent modules/plane-attachment modules/plane-discovery modules/range-overlaps stacks/shared/planes stacks/shared/entry-point stacks/tenants/vm stacks/tenants/isolated stacks/tenants/kubernetes; do
            tflint --chdir="$d" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format compact
          done
      - name: test configurations
        run: |
          for d in tests/fixtures/*/ tests/integration/*/; do
            tflint --chdir="$d" --config="$GITHUB_WORKSPACE/tests/integration/.tflint.hcl" --format compact
          done

  python:
    name: scripts and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: syntax check
        run: python3 -m py_compile tests/isolation/check.py
      - name: help runs
        run: python3 tests/isolation/check.py --help
      - name: tour script syntax
        run: python3 -m py_compile tests/tour/capture.py
      - name: shell scripts syntax
        run: bash -n scripts/publish-domains.sh images/kubernetes-node/build.sh
      - name: documentation links
        run: python3 tests/docs/check_links.py
      - name: inputs and outputs tables (terraform-docs)
        run: |
          curl -sSLo tfd.tgz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar xzf tfd.tgz terraform-docs && rm tfd.tgz
          for d in stacks/shared/* stacks/tenants/* tests/fixtures/* modules/*; do ./terraform-docs -c .terraform-docs.yml "$d"; done
          rm terraform-docs
          git diff --exit-code -- '*README.md'

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --no-banner --redact --verbose
