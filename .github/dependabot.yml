version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Module tags and provider constraints of every root configuration.
  - package-ecosystem: terraform
    directories:
      - /stacks/shared/entry-point
      - /stacks/shared/egress
      - /stacks/tenants/vm
      - /modules/kubernetes-cluster
      - /tests/fixtures/receiver
      - /tests/fixtures/acme
      - /tests/fixtures/internal-service
      - /tests/fixtures/resolver
    schedule:
      interval: weekly
