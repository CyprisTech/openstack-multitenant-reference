version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Module tags and provider constraints of every root configuration.
  - package-ecosystem: terraform
    directories:
      - /stacks/shared/entry-point
      - /stacks/tenants/vm
      - /stacks/tenants/isolated
      - /tests/fixtures/receiver
      - /tests/fixtures/acme
    schedule:
      interval: weekly
