# The configuration of a deployment, read by lz deploy (ADR-0018). lz init <directory> writes it in
# your deployment repository, with the inputs file of each stack beside it; then adapt each file:
#
#     lz deploy path/to/landing-zone.toml --dry-run    # the commands, without a cloud
#     lz deploy path/to/landing-zone.toml
#
# lz writes what the stacks give each other (attachments, the receiver, the sources of the entry
# point); every other input of a stack is in its own file below, as in the stack's README.

profile = "private-cloud"           # or "public-cloud" (ADR-0014)
site    = "par1"                    # prefix of every resource
mode    = "interface"               # plane mode: "interface" (hub planes) or "gateway" (operator planes)

[admin]                             # how lz reaches the bootstrap instances of the Kubernetes tenants
ssh_user = "ops"
ssh_key  = "~/.ssh/id_ed25519"

# [state]                           # the backend of the states, one key per stack; without it, a
# backend = "s3"                    # local state beside each stack
# config  = { bucket = "lz-states", endpoint = "https://s3.example.org", region = "par1" }
# key     = "key=par1/{stack}.tfstate"

[clouds]                            # clouds.yaml entry of each shared stack's project
planes      = "hub"
entry-point = "edge"
# egress    = "egress"              # the shared egress (stacks/shared/egress), optional

[stacks.planes]                     # the planes themselves: see examples/planes
inputs = "../planes/hub.tfvars.example"

[stacks.entry-point]
cidr   = "10.20.0.0/24"             # the range of the entry point's network
inputs = "../../stacks/shared/entry-point/terraform.tfvars.example"

[external]                          # values given to the tenants as they are (services outside the landing zone)
receiver = "https://metrics.example.org/api/v1/write"   # the remote write URL of your metrics receiver
# resolver = "10.38.0.5"            # a resolver behind the internal services plane, for tenants without egress

# Tenants consume, shared services offer. Their type says what lz deploys in their project:
# "vm" or "kubernetes" (a stack of the reference), or "existing" (nothing: lz attaches the
# project to the planes, for a project you run yourself).

[[tenants]]                         # one block per tenant, each in its own project and state
name   = "shop"
type   = "vm"
cloud  = "shop"
cidr   = "10.21.0.0/24"
planes = { publication = "tenant", observability = "tenant" }
inputs = "../../stacks/tenants/vm/terraform.tfvars.example"   # its own inputs: exposure, egress, domains, sizes…
# values = { instance_count = 2 }   # inputs given here rather than in a file
# egress_proxy   = true             # out through the shared egress, with egress = "shared" in its inputs
# egress_domains = [".ubuntu.com"]  # the names it may reach there

[[tenants]]
name          = "apps"
type          = "kubernetes"
cloud         = "apps"
cluster_cloud = "apps-cluster"      # the clouds.yaml entry of the cluster's application credential
cidr          = "10.24.0.0/22"
planes        = { publication = "tenant", observability = "tenant" }
inputs        = "../../stacks/tenants/kubernetes/terraform.tfvars.example"

[[tenants]]
name   = "legacy"
type   = "existing"                 # a project you keep: attached to the planes, nothing deployed
cloud  = "legacy"
cidr   = "10.25.0.0/24"
planes = { observability = "tenant", internal = "tenant" }
internal_sources = ["10.25.0.0/24"] # its addresses on the internal services plane, for the services it consumes

# [[shared-services]]               # the shared cluster, offering services on the internal plane
# name          = "platform"
# type          = "kubernetes"
# cloud         = "platform"
# cluster_cloud = "platform-cluster"
# cidr          = "10.36.0.0/24"
# planes        = { internal = "shared", observability = "tenant" }
# consumers     = ["shop", "apps", "legacy"]
# inputs        = "../../stacks/shared/kubernetes/terraform.tfvars.example"

[[shared-services]]                 # a shared service on virtual machines, offering a registry on the internal plane
name      = "registry"
type      = "vm"
cloud     = "registry"
cidr      = "10.37.0.0/27"
planes    = { internal = "shared", observability = "tenant" }
consumers = ["shop", "legacy"]
inputs    = "../../stacks/shared/vm/terraform.tfvars.example"   # its services, workload, sizes…

[[shared-services]]
name     = "metrics"
type     = "existing"               # your receiver, in a project of its own on the observability plane
cloud    = "metrics"
cidr     = "10.34.0.0/28"
planes   = { observability = "shared" }
provides = { receiver = "https://10.34.0.5:9090/api/v1/write" }   # given to every tenant (wins over [external])
