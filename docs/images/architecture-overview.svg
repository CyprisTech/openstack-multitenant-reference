<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Inter,'Segoe UI',Helvetica,Arial,'DejaVu Sans',sans-serif">
<title>openstack-multitenant-reference: architecture overview</title>
<desc>Source of architecture-overview.png, shown in the README. After editing this file, render the PNG at twice the size (3200 px wide) with a headless Chrome or Chromium, from this directory:
chromium --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=1600,960 --screenshot=architecture-overview.png architecture-overview.svg
Keep --window-size equal to the width and height of the svg element.</desc>
