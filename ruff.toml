# Lint of the Python of the repository: the campaign, the tests, the scripts the
# instances run. Checked by the CI (`ruff check`). No formatter: the layout of the code stays by hand.
line-length = 130
target-version = "py312"  # Ubuntu 24.04: the CI runners and the instances

[lint]
select = ["E", "W", "F", "I", "B", "UP"]
